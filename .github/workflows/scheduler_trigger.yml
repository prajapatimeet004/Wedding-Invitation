name: Trigger Wedding Reminders

on:
  schedule:
    # This runs the task every 60 minutes
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to trigger it manually from the "Actions" tab

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Scheduler Endpoint
        run: |
          # Replace 'yourusername.pythonanywhere.com' with your actual PythonAnywhere URL
          curl -X GET https://yourusername.pythonanywhere.com/trigger-reminders
